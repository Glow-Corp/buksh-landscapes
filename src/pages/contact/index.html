<section class="section on-dark" style="padding-top:clamp(56px,8vw,100px);padding-bottom:0" aria-labelledby="c-h">
  <div class="wrap">
    <p class="crumbs"><a href="{{root}}">Home</a><span>/</span><span>Contact</span></p>
    <h1 class="h1" id="c-h" style="max-width:14ch">Let's talk about your yard.</h1>
    <div class="contact-cards" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:0">
      <a class="c-card" href="tel:{{phone}}"><span class="ci"><svg class="i"><use href="#i-phone"/></svg></span><span><small>Call us</small><b>{{phoneDisplay}}</b></span></a>
      <a class="c-card" href="mailto:{{email}}"><span class="ci"><svg class="i"><use href="#i-mail"/></svg></span><span><small>Email</small><b>{{email}}</b></span></a>
      <div class="c-card"><span class="ci"><svg class="i"><use href="#i-clock"/></svg></span><span><small>Hours</small><b>Mon – Sun, 9 am – 5 pm</b></span></div>
      <div class="c-card"><span class="ci"><svg class="i"><use href="#i-pin"/></svg></span><span><small>Service area</small><b>Edmonton &amp; surrounding areas</b></span></div>
    </div>
  </div>
</section>
{{> quote}}
<section class="section" style="padding-top:clamp(48px,6vw,80px)" aria-label="Map">
  <div class="wrap">
    <div class="map"><iframe title="Map showing Buksh Landscapes in Edmonton" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=Buksh+Landscapes+Ltd+Edmonton&output=embed"></iframe></div>
  </div>
</section>
